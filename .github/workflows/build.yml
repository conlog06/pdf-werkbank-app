name: Desktop-Apps bauen

on:
  push:
    tags: ['v*']
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # aktuelle Weboberfläche (Editor, Bibliothek, Sync) aus dem Web-Repo
      - uses: actions/checkout@v4
        with:
          repository: conlog06/pdf-werkbank
          path: web-src

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run prepare-web

      # Push auf main oder Tag: Release „v<version aus package.json>“ anlegen (gibt es sie schon, bleibt sie)
      - name: Installer bauen
        run: npx electron-builder --publish ${{ (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Werkbank-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
          if-no-files-found: error
