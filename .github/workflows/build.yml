name: Desktop-Apps bauen

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # aktuelle Weboberfläche (Editor, Bibliothek, Sync) aus dem Web-Repo
      - uses: actions/checkout@v5
        with:
          repository: conlog06/pdf-werkbank
          path: web-src

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run prepare-web
        env:
          GOOGLE_DESKTOP_SECRET: ${{ secrets.GOOGLE_DESKTOP_SECRET }}

      - name: Installer bauen
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Werkbank-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  # Release „v<version aus package.json>“ mit allen Installern anlegen bzw. ergänzen
  release:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          ls -la out
          # liegengebliebene Entwürfe aufräumen
          gh api "repos/$R/releases" --jq '.[] | select(.draft) | .id' | xargs -r -I{} gh api -X DELETE "repos/$R/releases/{}"
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" out/* --clobber
          else
            gh release create "$V" out/* --title "PDF Werkbank $V" --latest --notes "PDF Werkbank $V für Windows und macOS. Download: .exe für Windows, .dmg für Mac (arm64 = Apple-Chip, x64 = Intel). Erster Start: siehe README."
          fi
