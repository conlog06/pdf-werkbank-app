name: Desktop-Apps bauen

on:
  push:
    branches: [main, 'ci-*']
    tags: ['v*']
    paths-ignore: ['**.md', 'ci/**', '.github/workflows/mactest.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/heads/ci-') }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # aktuelle Weboberfläche (Editor, Bibliothek, Sync) aus dem Web-Repo
      - uses: actions/checkout@v5
        with:
          repository: conlog06/pdf-werkbank
          path: web-src

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run prepare-web
        env:
          GOOGLE_DESKTOP_SECRET: ${{ secrets.GOOGLE_DESKTOP_SECRET }}

      - name: Installer bauen
        run: npx electron-builder --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Prüfen, ob die App sich wirklich als PDF-Programm anmeldet (echte Rechner in der CI)
      - name: Standard-PDF-Programm testen (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          APP=$(ls -d dist/mac-arm64/*.app dist/mac/*.app 2>/dev/null | head -1)
          echo "App: $APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes' "$APP/Contents/Info.plist" || true
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$APP"
          node -e "const d=require('./default-app'),o={bundleId:'de.loggx.pdfwerkbank',openExternal:async()=>{}};(async()=>{console.log('vorher',await d.status(o));console.log('setzen',await d.makeDefault(o));console.log('nachher',await d.status(o))})()"
      - name: Standard-PDF-Programm testen (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          Start-Process $exe.FullName -ArgumentList '/S' -Wait
          reg query "HKCU\Software\RegisteredApplications" /v "PDF Werkbank"
          reg query "HKCU\Software\PDF Werkbank\Capabilities\FileAssociations"
          reg query "HKCU\Software\Classes\PDFWerkbank.Document\shell\open\command"
          reg query "HKCU\Software\Classes\.pdf\OpenWithProgids"
          node -e "require('./default-app').status({bundleId:'x'}).then(r=>console.log('status',r))"

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Werkbank-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  # Android-App (APK) mit Capacitor: gleiche Weboberfläche, Downloads über „Teilen“
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: conlog06/pdf-werkbank
          path: web-src
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run prepare-web
        env:
          GOOGLE_DESKTOP_SECRET: ${{ secrets.GOOGLE_DESKTOP_SECRET }}
      - run: npm run prepare-android
      - run: npx cap add android
      - name: Berechtigungen und Version
        run: |
          V=$(node -p "require('./package.json').version")
          CODE=$(node -p "const [a,b,c]=require('./package.json').version.split('.').map(Number);a*10000+b*100+c")
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />#' $M
          grep -n "permission" $M
          sed -i "s/versionCode 1$/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
      - name: App-Symbol
        continue-on-error: true
        run: |
          mkdir -p assets && cp web/icons/icon-512.png assets/icon-only.png && cp web/icons/icon-maskable-512.png assets/icon-foreground.png && cp web/icons/icon-512.png assets/splash.png
          npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#1f4fd8' --splashBackgroundColor '#f4f6f9'
      - run: npx cap sync android
      - name: APK bauen
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
          cd .. && mkdir -p apk && cp android/app/build/outputs/apk/debug/app-debug.apk "apk/PDF-Werkbank-$(node -p "require('./package.json').version")-Android.apk"
          ls -la apk
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Werkbank-Android
          path: apk/*.apk
          if-no-files-found: error

  # Release „v<version aus package.json>“ mit allen Installern anlegen bzw. ergänzen
  release:
    needs: [build, android]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: out
          merge-multiple: true
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          ls -la out
          # liegengebliebene Entwürfe aufräumen
          gh api "repos/$R/releases" --jq '.[] | select(.draft) | .id' | xargs -r -I{} gh api -X DELETE "repos/$R/releases/{}"
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" out/* --clobber
          else
            gh release create "$V" out/* --title "PDF Werkbank $V" --latest --notes "PDF Werkbank $V für Windows, macOS und Android. Download: .exe für Windows, .dmg für Mac (arm64 = Apple-Chip, x64 = Intel), .apk für Android (installieren aus unbekannten Quellen erlauben). Erster Start: siehe README."
          fi
