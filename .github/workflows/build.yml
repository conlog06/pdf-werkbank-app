name: Desktop-Apps bauen

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # aktuelle Weboberfläche (Editor, Bibliothek, Sync) aus dem Web-Repo
      - uses: actions/checkout@v5
        with:
          repository: conlog06/pdf-werkbank
          path: web-src

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run prepare-web

      # beide Systeme laden in denselben Release-Entwurf „v<version>“; veröffentlicht wird danach
      - name: Installer bauen
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Werkbank-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/latest*.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="v$(node -p "require('./package.json').version")"
          if gh release view "$V" --json isDraft -q .isDraft | grep -q true; then
            gh release edit "$V" --draft=false --latest --notes "PDF Werkbank $V für Windows und macOS. Installation: siehe README."
          else
            echo "$V ist schon veröffentlicht"
          fi
